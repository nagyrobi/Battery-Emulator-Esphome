        # This display / ESPHome itself. Everything fits, so no scrolling here - which
        # also keeps a drag on the slider from ever becoming a scroll.
        - obj:
            id: sys_disp
            styles: st_card
            scrollable: false
            hidden: true
            x: 10
            y: 72
            width: 460
            height: 298
            pad_left: 16
            pad_right: 22
            pad_top: 8
            pad_bottom: 8
            layout:
              type: GRID
              pad_row: 0
              grid_columns: [FR(40), FR(60)]
              grid_rows: [22, 44, 35, 35, 35, 35, 35, 35]
            widgets:
              - label: { text: "THIS DISPLAY", text_font: montserrat_12, text_color: "0x${c_muted}", grid_cell_column_pos: 0, grid_cell_column_span: 2, grid_cell_row_pos: 0, grid_cell_y_align: END }
              - label: { id: v_bl, text: "BACKLIGHT", text_font: montserrat_16, text_color: "0x${c_muted}", grid_cell_column_pos: 0, grid_cell_row_pos: 1, grid_cell_y_align: CENTER }
              # Bound to the bl_level number below, which stores the setting and
              # restores it at boot. 90 % is the floor.
              - slider:
                  id: bl_slider
                  min_value: 30
                  max_value: 100
                  value: 100
                  height: 12
                  gesture_bubble: false     # dragging it must not flip the page
                  grid_cell_column_pos: 1
                  grid_cell_row_pos: 1
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: CENTER
                  bg_color: "0x${c_arc_bg}"
                  bg_opa: COVER
                  radius: 6
                  indicator:
                    bg_color: "0x${c_green}"
                    radius: 6
                  knob:
                    bg_color: 0xFFFFFF
                    border_width: 0
                    shadow_width: 0
                    pad_all: 6
