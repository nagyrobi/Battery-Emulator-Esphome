              - label: { text: "WIFI SIGNAL", text_font: montserrat_16, text_color: "0x${c_muted}", grid_cell_column_pos: 0, grid_cell_row_pos: 4, grid_cell_y_align: CENTER }
              - label: { id: v_drssi, text: "--", text_font: montserrat_16, grid_cell_column_pos: 1, grid_cell_row_pos: 4, grid_cell_x_align: END, grid_cell_y_align: CENTER }
              - label: { text: "IP ADDRESS", text_font: montserrat_16, text_color: "0x${c_muted}", grid_cell_column_pos: 0, grid_cell_row_pos: 5, grid_cell_y_align: CENTER }
              - label: { id: v_dip, text: "--", text_font: montserrat_16, grid_cell_column_pos: 1, grid_cell_row_pos: 5, grid_cell_x_align: END, grid_cell_y_align: CENTER }
              - label: { text: "UPTIME", text_font: montserrat_16, text_color: "0x${c_muted}", grid_cell_column_pos: 0, grid_cell_row_pos: 6, grid_cell_y_align: CENTER }
              - label: { id: v_dup, text: "--", text_font: montserrat_16, grid_cell_column_pos: 1, grid_cell_row_pos: 6, grid_cell_x_align: END, grid_cell_y_align: CENTER }
              - label: { text: "FREE HEAP", text_font: montserrat_16, text_color: "0x${c_muted}", grid_cell_column_pos: 0, grid_cell_row_pos: 7, grid_cell_y_align: CENTER }
              - label: { id: v_dheap, text: "--", text_font: montserrat_16, grid_cell_column_pos: 1, grid_cell_row_pos: 7, grid_cell_x_align: END, grid_cell_y_align: CENTER }
        # Selector, where the reference has its CONNECTION SETUP button: one button per
        # configured emulator, then Display. Buttons that emu_boot hides (unconfigured
        # emulators) drop out of the flex row and the rest share the width. The buttons
        # behave as a radio group; show_sys_view keeps exactly one of them checked.
        # Tapping an emulator also starts watching it; Display leaves the watched
        # emulator alone.
        - obj:
            x: 10
            y: 380
            width: 460
            height: 62
            scrollable: false
