              - label: { text: "SIGNAL", text_font: montserrat_16, text_color: "0x${c_muted}", grid_cell_column_pos: 0, grid_cell_row_pos: 17, grid_cell_y_align: CENTER }
              - label: { id: v_rssi, text: "--", text_font: montserrat_16, grid_cell_column_pos: 1, grid_cell_row_pos: 17, grid_cell_x_align: END, grid_cell_y_align: CENTER }
              - label: { text: "AP MODE", text_font: montserrat_16, text_color: "0x${c_muted}", grid_cell_column_pos: 0, grid_cell_row_pos: 18, grid_cell_y_align: CENTER }
