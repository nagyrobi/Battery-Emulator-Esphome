# =============================================================================
# Hardware pak: the resistive-touch "Cheap Yellow Display" with the 2.4" 320x240 panel
# (the ESP32-2432S024R pinout: backlight GPIO27, the touch controller on the display's own
# SPI bus), plain ESP32 (no PSRAM). A landscape screen as it comes: no rotation.
#
# Included from the main config:
#   packages:
#     display_hw: !include pak/zz_be_mon_hw_esp32_2432s024r.yaml
# and comment the `vnc` package out: it keeps a copy of the frame in RAM.
# Taken from a configuration that runs on the board (there with the `ili9xxx` platform, model
# `TFT 2.4R`, which ESPHome has deprecated); the panel is driven here by `mipi_spi` with the
# `ILI9342` model (320x240 as it comes, mirrored in X by the model: the same MADCTL as before,
# with RGB colours). Its init sequence differs a little from the ili9xxx one (gamma curves,
# display function control), so look at the first start: NOT RUN ON THE BOARD with mipi_spi.
# The XPT2046 keeps the calibration and the mirrored axes of the working configuration.
#
# How it differs from the other CYD pak (zz_be_mon_hw_esp32_2432s028r.yaml):
#   - the panel is driven as 320x240 (model ILI9342), not as a portrait 240x320 one;
#   - the XPT2046 sits on the same SPI bus as the panel (CLK 14 / MOSI 13 / MISO 12), chip
#     select 33, no interrupt line used;
#   - the backlight is on GPIO27.
# The board's light sensor (GPIO34) is not used.
# If taps land mirrored, change `transform`; if they are offset, `calibration`. If the colours
# are swapped, flip `color_order` (RGB / BGR); if the picture is mirrored, `transform` on the
# display. 320x240 is small: expect small print.
#
# What a pak provides: see zz_be_mon_hw_template.yaml
# =============================================================================

substitutions:
  disp_w: 320
  disp_h: 240
  disp_rot: 0              # landscape as it comes: no rotation

esp32:
  board: esp32dev
  framework:
    type: esp-idf

spi:
  - id: tft_spi            # the panel and the touch controller share this bus
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin:
      number: GPIO12
      ignore_strapping_warning: true

output:
  - platform: ledc
    id: gpio_backlight_pwm
    pin: GPIO27
  - platform: ledc
    id: output_red
    pin: GPIO4
    inverted: true
  - platform: ledc
    id: output_green
    pin: GPIO17
    inverted: true
  - platform: ledc
    id: output_blue
    pin: GPIO16
    inverted: true

light:
  - platform: rgb
    name: LED pixel
    id: led
    red: output_red
    green: output_green
    blue: output_blue
    restore_mode: ALWAYS_OFF
    
display:
  - platform: mipi_spi
    id: my_display
    spi_id: tft_spi
    model: ST7789V
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: false
    dimensions:
      height: 240
      width: 320
    color_order: BGR
    invert_colors: false
    cs_pin:
      number: GPIO15
      ignore_strapping_warning: true
    dc_pin:
      number: GPIO2
      ignore_strapping_warning: true
    data_rate: 40MHz
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: xpt2046
    id: my_touch
    spi_id: tft_spi
    cs_pin: GPIO33
    display: my_display
    update_interval: 20ms      # LVGL detects swipes from successive samples: poll fast
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false
    on_release:
      - script.execute: wake_ui

lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touch
  buffer_size: 25%
