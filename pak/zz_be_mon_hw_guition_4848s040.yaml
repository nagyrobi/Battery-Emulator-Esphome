# =============================================================================
# Hardware pak: Guition ESP32-S3-4848S040 - 4" 480x480, ST7701S RGB panel, GT911 touch
#
# Included from the main config:
#   packages:
#     display_hw: !include pak/zz_be_mon_hw_guition_4848s040.yaml
# Verified on the real board.
#
# What a pak provides: see zz_be_mon_hw_template.yaml
# =============================================================================

substitutions:
  disp_w: 480
  disp_h: 480
  disp_rot: 0              # square, mounted upright: no rotation

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
#    sdkconfig_options:
#      # The S3 display stack leaves little internal RAM for HTTPS OTA checks.
#      # Allocate mbedTLS buffers from PSRAM so firmware downloads can connect.
#      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
#      # Keep the ESP32 task watchdog long enough for display startup while
#      # remaining compatible with ESPHome 2026.4 and newer.
#      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "30"
#      # Keep WiFi startup inside the internal-RAM budget after the RGB display
#      # and LVGL buffers are initialized.
#      CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM: "8"
#      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
#      # The RGB driver already restarts after a genuine DMA underflow. Restarting
#      # on every VSYNC can instead shift the framebuffer by one bounce-buffer block.
#      CONFIG_LCD_RGB_RESTART_IN_VSYNC: "n"
#      CONFIG_LCD_RGB_ISR_IRAM_SAFE: "y"
#      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
#      CONFIG_SPIRAM_RODATA: "y"

psram:
  speed: 80MHz
  mode: octal

spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47

i2c:
  id: touchscreen_bus
  sda: GPIO19
  scl: { number: 45, ignore_strapping_warning: true }

output:
  - platform: ledc
    id: gpio_backlight_pwm
    pin: GPIO38
    frequency: 150Hz
    min_power: 0.01
    zero_means_zero: true

display:
  - platform: st7701s
    id: my_display
    dimensions:
      width: ${disp_w}
      height: ${disp_h}
    spi_mode: MODE3
    data_rate: 2MHz
    color_order: RGB
    invert_colors: False
    cs_pin: 39
    de_pin: 18
    hsync_pin: 16
    vsync_pin: 17
    pclk_pin: 21
    pclk_frequency: 12MHz
    pclk_inverted: False
    hsync_pulse_width: 8
    hsync_front_porch: 10
    hsync_back_porch: 20
    vsync_pulse_width: 8
    vsync_front_porch: 10
    vsync_back_porch: 10
    update_interval: never
    auto_clear_enabled: False
    init_sequence:
      - 1
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10] # CMD2_BKSEL_BK0
      - [0xCD, 0x00] # disable MDT flag
    data_pins:
      red: [11, 12, 13, 14, 0]
      green: [8, 20, 3, 46, 9, 10]
      blue: [4, 5, 6, 7, 15]

touchscreen:
  - platform: gt911
    id: my_touch
    display: my_display
    update_interval: 16ms    # LVGL detects swipes from successive samples: poll fast
    transform:
      mirror_x: false
      mirror_y: false
    on_release:
      - script.execute: wake_ui

lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touch
  buffer_size: 100%          # the RGB panel has PSRAM to spare: render whole frames
  # rotation: 270            # only if the panel is mounted turned; then set disp_rot to match
