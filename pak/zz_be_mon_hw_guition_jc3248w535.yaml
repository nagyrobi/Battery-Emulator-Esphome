# =============================================================================
# Hardware pak: Guition JC3248W535 - 3.5" 320x480 (portrait panel), AXS15231B QSPI
# display and AXS15231 touch. Used as a 480x320 landscape screen.
#
# Included from the main config:
#   packages:
#     display_hw: !include pak/zz_be_mon_hw_guition_jc3248w535.yaml
#
# Tested on the board. The panel is a portrait one, so `lvgl: rotation` (90 or 270,
# whichever puts the top of the UI where you want it) makes it landscape - and disp_rot
# must say the same. Flip both if the picture is upside down. The touch follows through
# `display: my_display`. (With the VNC display in the LVGL list, LVGL rotates in software
# and feeds every display the panel's own 320x480, which is why disp_w / disp_h stay
# portrait; without the `vnc` package the display driver rotates in hardware.)
#
# What a pak provides: see zz_be_mon_hw_template.yaml
# =============================================================================

substitutions:
  disp_w: 320              # the panel as the driver reports it ...
  disp_h: 480
  disp_rot: 90             # ... and the rotation that makes the UI 480x320 landscape
  device_description: "Guition JC3248w535"

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  speed: 80MHz
  mode: octal

spi:
  id: display_qspi
  type: quad
  clk_pin: 47
  data_pins:
    - 21
    - 48
    - 40
    - 39

i2c:
  id: touchscreen_bus
  sda: 4
  scl: 8

output:
  - platform: ledc
    id: gpio_backlight_pwm
    pin: 1

display:
  - platform: mipi_spi
    id: my_display
    model: JC3248W535

touchscreen:
  - platform: axs15231
    id: my_touch
    display: my_display
    update_interval: 30ms  # LVGL detects swipes from successive samples: poll fast
    on_release:
      - script.execute: wake_ui
    # interrupt_pin:
    #   number: 3
    #   ignore_strapping_warning: true
    # calibration:
    #   x_min: 0
    #   x_max: 479
    #   y_min: 0
    #   y_max: 319

lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touch
  buffer_size: 25%           # the QSPI panel is flushed in slices
  rotation: 90
